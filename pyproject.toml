[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-scraper"
version = "0.1.0"
description = "Learning project for extracting public job listing cards into SQLite"
authors = [{ name = "Sohila Khaled Abbas" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "requests>=2.31,<3",
  "pandas>=2.2,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=7.4,<10"]
browser = ["selenium>=4.20,<5", "webdriver-manager>=4,<5"]

[tool.setuptools.packages.find]
include = ["src*"]
